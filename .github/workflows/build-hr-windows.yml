# Build HRExtractor.exe for Windows
# Triggers on every push to main, or manually via "Run workflow"
# Download the artifact from the Actions -> run -> Artifacts section

name: Build HR Extractor (Windows EXE)

on:
  push:
    branches: [main, master, hr-extractor]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Playwright Chromium into playwright_browsers/
        shell: cmd
        run: |
          set PLAYWRIGHT_BROWSERS_PATH=%CD%\playwright_browsers
          python -m playwright install chromium --with-deps

      - name: Build HRExtractor.exe
        shell: cmd
        run: |
          set PLAYWRIGHT_BROWSERS_PATH=%CD%\playwright_browsers
          python -m PyInstaller --clean --noconfirm HRExtractor_windows.spec

      - name: Verify EXE was created
        shell: cmd
        run: |
          if not exist "dist\HRExtractor.exe" (
            echo ERROR: dist\HRExtractor.exe not found
            exit /b 1
          )
          dir dist\HRExtractor.exe

      - name: Upload HRExtractor.exe
        uses: actions/upload-artifact@v4
        with:
          name: HRExtractor-Windows-${{ github.sha }}
          path: dist/HRExtractor.exe
          retention-days: 30
